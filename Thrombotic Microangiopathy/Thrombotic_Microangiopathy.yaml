# Curated using dismech (Disorder Mechanisms Knowledge Base), Claude Code and Claude Skills
name: Thrombotic Microangiopathy
category: Complex
disease_term:
  preferred_term: thrombotic microangiopathy
  term:
    id: MONDO:0019737
    label: thrombotic microangiopathy
parents:
  - Microangiopathy
  - Thrombotic Disease (MONDO:0000831)
has_subtypes:
  - name: Thrombotic Thrombocytopenic Purpura
    subtype_term:
      preferred_term: thrombotic thrombocytopenic purpura
      term:
        id: MONDO:0018896
        label: thrombotic thrombocytopenic purpura
    classification: mondo_nested_subclass
    description: >
      TTP is caused by severe deficiency of ADAMTS13, the von Willebrand factor-cleaving
      protease. Most cases are immune-mediated (autoantibodies against ADAMTS13); congenital
      TTP (Upshaw-Schulman syndrome) is caused by biallelic ADAMTS13 mutations.
  - name: Hemolytic Uremic Syndrome
    subtype_term:
      preferred_term: hemolytic-uremic syndrome
      term:
        id: MONDO:0001549
        label: hemolytic-uremic syndrome
    classification: clinical_phenotype
    description: >
      HUS is characterized by microangiopathic hemolytic anemia, thrombocytopenia, and acute
      kidney injury. The typical form is triggered by Shiga toxin-producing Escherichia coli
      (STEC-HUS); atypical HUS (aHUS) results from dysregulation of the complement alternative
      pathway.
  - name: Drug-induced Thrombotic Microangiopathy
    classification: clinical_phenotype
    description: >
      Various drugs (quinine, calcineurin inhibitors, VEGF inhibitors, platinum compounds,
      gemcitabine) can trigger TMA through immune mechanisms or direct endothelial toxicity.
  - name: Secondary Thrombotic Microangiopathy
    classification: clinical_phenotype
    description: >
      TMA occurring in the context of other systemic conditions such as malignant hypertension,
      pregnancy complications (HELLP syndrome, preeclampsia), systemic lupus erythematosus,
      antiphospholipid syndrome, or hematopoietic stem cell transplantation.
pathophysiology:
  - name: Endothelial Cell Injury and Activation
    description: >
      The unifying initiating event in all TMA subtypes is injury to microvascular endothelial
      cells. Endothelial damage exposes subendothelial matrix, triggers von Willebrand factor
      (VWF) release, and activates the coagulation cascade. Endothelial activation leads to
      upregulation of adhesion molecules, procoagulant surface expression, and loss of
      anticoagulant thrombomodulin expression.
    cell_types:
      - preferred_term: Endothelial Cell
        term:
          id: CL:0000115
          label: endothelial cell
    biological_processes:
      - preferred_term: Endothelial Cell Activation
        term:
          id: GO:0042118
          label: endothelial cell activation
        modifier: INCREASED
      - preferred_term: Blood Coagulation
        term:
          id: GO:0007596
          label: blood coagulation
        modifier: INCREASED
    downstream:
      - target: Platelet Aggregation and Microvascular Thrombosis
        description: >
          Endothelial injury exposes subendothelial matrix and releases VWF multimers,
          directly triggering platelet adhesion and microthrombus formation.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The common pathogenetic features in STEC-HUS, aHUS, and secondary HUS are simultaneous damage to endothelial cells, intravascular hemolysis, and activation of platelets leading to a procoagulative state, formation of microthrombi, and tissue damage."
        explanation: "Identifies endothelial cell damage as a universal pathogenetic feature across all HUS subtypes, establishing it as the unifying initiating event in TMA."
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Common for the pathogenesis seems to be the vicious cycle of complement activation, endothelial cell damage, platelet activation, and thrombosis."
        explanation: "Describes the self-amplifying cycle in which endothelial cell damage drives downstream complement activation and thrombosis."

  - name: ADAMTS13 Deficiency and Ultra-Large VWF Multimers
    description: >
      In TTP, severe deficiency of ADAMTS13 (a disintegrin and metalloproteinase with a
      thrombospondin type 1 motif, member 13) prevents cleavage of ultra-large von Willebrand
      factor multimers (UL-VWF) secreted by endothelial cells. UL-VWF strings recruit
      platelets under high shear stress, forming platelet-rich microthrombi predominantly in
      arterioles and capillaries. This leads to consumptive thrombocytopenia and mechanical
      red blood cell fragmentation (schistocyte formation).
    cell_types:
      - preferred_term: Endothelial Cell
        term:
          id: CL:0000115
          label: endothelial cell
    biological_processes:
      - preferred_term: Platelet Activation
        term:
          id: GO:0030168
          label: platelet activation
        modifier: INCREASED
      - preferred_term: Blood Coagulation
        term:
          id: GO:0007596
          label: blood coagulation
        modifier: INCREASED
    downstream:
      - target: Platelet Aggregation and Microvascular Thrombosis
        description: >
          Uncleaved UL-VWF multimers accumulate on endothelial surfaces and recruit platelets,
          forming platelet-rich thrombi that occlude the microvasculature.
      - target: Microangiopathic Hemolytic Anemia
        description: >
          Platelet microthrombi mechanically destroy erythrocytes passing through
          narrowed vessels, producing schistocytes and hemolysis.
    evidence:
      - reference: PMID:11586351
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We show that deficiency of ADAMTS13 is the molecular mechanism responsible for TTP, and suggest that physiologic proteolysis of VWF and/or other ADAMTS13 substrates is required for normal vascular homeostasis."
        explanation: "Establishes ADAMTS13 deficiency as the molecular mechanism of TTP through genetic linkage in congenital TTP pedigrees, directly linking failed VWF cleavage to disease."
      - reference: PMID:30625070
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In acquired thrombotic thrombocytopenic purpura (TTP), an immune-mediated deficiency of the von Willebrand factor-cleaving protease ADAMTS13 allows unrestrained adhesion of von Willebrand factor multimers to platelets and microthrombosis, which result in thrombocytopenia, hemolytic anemia, and tissue ischemia."
        explanation: "Confirms that ADAMTS13 deficiency causes unrestrained VWF-platelet adhesion and microthrombosis, directly linking the mechanism to the clinical triad of thrombocytopenia, hemolytic anemia, and tissue ischemia."
      - reference: PMID:12660343
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Recent studies have demonstrated that deficiency in the von Willebrand factor cleaving protease ADAMTS13, due to genetic mutations or autoimmune inhibitors, causes TTP."
        explanation: "Confirms the dual etiology of ADAMTS13 deficiency — hereditary mutations (congenital TTP) and autoimmune inhibitors (acquired TTP) — both leading to the same pathophysiology."

  - name: Complement Alternative Pathway Dysregulation
    description: >
      In atypical HUS, loss-of-function mutations in complement regulatory proteins (CFH,
      CFI, MCP/CD46) or gain-of-function mutations in complement activators (CFB, C3) lead
      to uncontrolled complement activation on endothelial cell surfaces. Unopposed
      C3 convertase activity generates C3b deposition and membrane attack complex (MAC)
      formation, causing direct endothelial lysis and activation. Anti-CFH autoantibodies
      can also impair regulatory function.
    cell_types:
      - preferred_term: Endothelial Cell
        term:
          id: CL:0000115
          label: endothelial cell
    biological_processes:
      - preferred_term: Complement Activation via Alternative Pathway
        term:
          id: GO:0006957
          label: complement activation, alternative pathway
        modifier: INCREASED
      - preferred_term: Complement Activation
        term:
          id: GO:0006956
          label: complement activation
        modifier: INCREASED
    downstream:
      - target: Endothelial Cell Injury and Activation
        description: >
          MAC-mediated lysis and complement-induced signaling activate endothelial cells,
          amplifying the procoagulant response.
      - target: Platelet Aggregation and Microvascular Thrombosis
        description: >
          Complement-activated endothelial cells upregulate P-selectin and release VWF,
          promoting platelet adhesion and microthrombus formation.
    evidence:
      - reference: PMID:23738544
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Atypical hemolytic-uremic syndrome is a genetic, life-threatening, chronic disease of complement-mediated thrombotic microangiopathy."
        explanation: "Establishes aHUS as a complement-mediated TMA, confirming that dysregulated complement activation is the primary driver of this subtype."
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "aHUS is associated primarily with mutations or autoantibodies leading to dysregulated complement activation."
        explanation: "Confirms the genetic basis of complement dysregulation in aHUS, with mutations in complement regulatory proteins or anti-CFH autoantibodies as the proximate causes."

  - name: Shiga Toxin-Mediated Endothelial Injury
    description: >
      In STEC-HUS, Shiga toxin (Stx1, Stx2) produced by enterohemorrhagic E. coli binds
      to globotriaosylceramide (Gb3) receptors expressed on renal tubular and glomerular
      endothelial cells. Internalized toxin inhibits protein synthesis, triggering endothelial
      apoptosis and activating inflammatory pathways. Stx also induces upregulation of Gb3
      expression and promotes thrombotic microangiopathy predominantly in the kidney.
    cell_types:
      - preferred_term: Glomerular Endothelial Cell
        term:
          id: CL:0002188
          label: glomerular endothelial cell
    biological_processes:
      - preferred_term: Apoptosis
        term:
          id: GO:0006915
          label: apoptotic process
        modifier: INCREASED
      - preferred_term: Inflammatory Response
        term:
          id: GO:0006954
          label: inflammatory response
        modifier: INCREASED
    downstream:
      - target: Endothelial Cell Injury and Activation
        description: >
          Shiga toxin-induced endothelial apoptosis and inflammation cause widespread
          microvascular endothelial damage, primarily in the kidney.
      - target: Platelet Aggregation and Microvascular Thrombosis
        description: >
          Damaged endothelial surfaces promote platelet adhesion and fibrin deposition,
          leading to glomerular and renal arteriolar microthrombi.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Typical HUS (ie, STEC-HUS) follows a gastrointestinal infection with STEC, whereas aHUS is associated primarily with mutations or autoantibodies leading to dysregulated complement activation."
        explanation: "Confirms that STEC gastrointestinal infection is the trigger for typical HUS, establishing Shiga toxin as the initiating pathogen in STEC-HUS."
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "HUS is usually categorized as typical, caused by Shiga toxin-producing Escherichia coli (STEC) infection, as atypical HUS (aHUS), usually caused by uncontrolled complement activation, or as secondary HUS with a coexisting disease."
        explanation: "Places STEC-mediated HUS within the classification of TMA, establishing Shiga toxin-producing E. coli as the etiologic agent of typical HUS."

  - name: Platelet Aggregation and Microvascular Thrombosis
    description: >
      Activated platelets adhere to damaged endothelium and ultra-large VWF multimers, forming
      platelet-rich microthrombi in arterioles and capillaries. These thrombi cause mechanical
      destruction of erythrocytes passing through narrowed vessels (producing schistocytes),
      consumptive thrombocytopenia, and downstream ischemia to vital organs including the
      brain and kidneys.
    cell_types:
      - preferred_term: Platelet
        term:
          id: CL:0000233
          label: platelet
    biological_processes:
      - preferred_term: Platelet Aggregation
        term:
          id: GO:0070527
          label: platelet aggregation
        modifier: INCREASED
      - preferred_term: Blood Coagulation, Fibrin Clot Formation
        term:
          id: GO:0072378
          label: blood coagulation, fibrin clot formation
        modifier: INCREASED
    downstream:
      - target: Microangiopathic Hemolytic Anemia
        description: >
          Occluded microvessels mechanically fragment erythrocytes, producing
          schistocytes and non-immune hemolytic anemia.
      - target: Organ Ischemia and End-Organ Damage
        description: >
          Platelet microthrombi cause ischemia in the brain (TTP), kidneys (HUS),
          and other organs, driving the clinical syndrome.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The common pathogenetic features in STEC-HUS, aHUS, and secondary HUS are simultaneous damage to endothelial cells, intravascular hemolysis, and activation of platelets leading to a procoagulative state, formation of microthrombi, and tissue damage."
        explanation: "Identifies platelet activation and microthrombus formation as universal downstream consequences of endothelial injury across all TMA subtypes."
      - reference: PMID:30625070
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Caplacizumab, an anti-von Willebrand factor humanized, bivalent variable-domain-only immunoglobulin fragment, inhibits interaction between von Willebrand factor multimers and platelets."
        explanation: "Demonstrates that VWF-platelet interaction drives microthrombus formation in TTP; blocking this interaction with caplacizumab is therapeutically effective, confirming the mechanism."

  - name: Microangiopathic Hemolytic Anemia
    description: >
      Red blood cells passing through partially occluded microvessels are subjected to
      mechanical shear forces, leading to fragmentation and formation of schistocytes.
      This non-immune hemolytic anemia is characterized by elevated lactate dehydrogenase
      (LDH), low haptoglobin, elevated reticulocyte count, and negative direct antiglobulin
      test (Coombs test).
    cell_types:
      - preferred_term: Erythrocyte
        term:
          id: CL:0000232
          label: erythrocyte
    biological_processes:
      - preferred_term: Erythrocyte Homeostasis
        term:
          id: GO:0034101
          label: erythrocyte homeostasis
        modifier: DECREASED
      - preferred_term: Erythrocyte Clearance
        term:
          id: GO:0034102
          label: erythrocyte clearance
        modifier: INCREASED
    evidence:
      - reference: PMID:12660343
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Thrombotic thrombocytopenic purpura (TTP) and the hemolytic uremic syndrome (HUS) are both characterized by thrombocytopenia, microangiopathic hemolysis, and organ dysfunction."
        explanation: "Establishes microangiopathic hemolysis as a core defining feature of both TTP and HUS, reflecting mechanical erythrocyte destruction in the microvasculature."
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy characterized by intravascular hemolysis, thrombocytopenia, and acute kidney failure."
        explanation: "Confirms intravascular hemolysis as a defining pathophysiological feature of TMA, consistent with the mechanical fragmentation mechanism."

  - name: Organ Ischemia and End-Organ Damage
    description: >
      Microvascular thrombosis causes ischemia in multiple organ systems. In TTP, neurological
      involvement predominates (confusion, seizures, stroke). In HUS, renal involvement
      predominates with acute kidney injury, often requiring dialysis. Myocardial, gastrointestinal,
      and hepatic involvement can also occur, contributing to the high morbidity of TMA syndromes.
    cell_types:
      - preferred_term: Glomerular Endothelial Cell
        term:
          id: CL:0002188
          label: glomerular endothelial cell
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: Response to Ischemia
        term:
          id: GO:0002931
          label: response to ischemia
        modifier: INCREASED
    evidence:
      - reference: PMID:30625070
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In acquired thrombotic thrombocytopenic purpura (TTP), an immune-mediated deficiency of the von Willebrand factor-cleaving protease ADAMTS13 allows unrestrained adhesion of von Willebrand factor multimers to platelets and microthrombosis, which result in thrombocytopenia, hemolytic anemia, and tissue ischemia."
        explanation: "Documents tissue ischemia as a direct consequence of microthrombosis in TTP, establishing end-organ damage as the clinical result of platelet microthrombus formation."
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy characterized by intravascular hemolysis, thrombocytopenia, and acute kidney failure."
        explanation: "Identifies acute kidney failure as a direct consequence of TMA in HUS, reflecting renal microvascular ischemia from microthrombus occlusion."

phenotypes:
  - category: Clinical
    name: Microangiopathic Hemolytic Anemia
    description: >
      Non-immune hemolytic anemia caused by mechanical destruction of erythrocytes in
      narrowed microvessels. Schistocytes (fragmented red blood cells) are the hallmark
      finding on peripheral blood smear, along with elevated LDH, low haptoglobin, and
      negative Coombs test.
    phenotype_term:
      preferred_term: Microangiopathic hemolytic anemia
      term:
        id: HP:0001937
        label: Microangiopathic hemolytic anemia
    evidence:
      - reference: PMID:12660343
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Thrombotic thrombocytopenic purpura (TTP) and the hemolytic uremic syndrome (HUS) are both characterized by thrombocytopenia, microangiopathic hemolysis, and organ dysfunction."
        explanation: "Establishes microangiopathic hemolytic anemia as a core diagnostic feature of TMA, common to both TTP and HUS."

  - category: Clinical
    name: Thrombocytopenia
    description: >
      Consumptive thrombocytopenia results from platelet sequestration in microthrombi.
      Platelet counts are typically below 30,000/μL in TTP and below 150,000/μL in HUS.
    phenotype_term:
      preferred_term: Thrombocytopenia
      term:
        id: HP:0001873
        label: Thrombocytopenia
    evidence:
      - reference: PMID:30625070
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In acquired thrombotic thrombocytopenic purpura (TTP), an immune-mediated deficiency of the von Willebrand factor-cleaving protease ADAMTS13 allows unrestrained adhesion of von Willebrand factor multimers to platelets and microthrombosis, which result in thrombocytopenia, hemolytic anemia, and tissue ischemia."
        explanation: "Directly links thrombocytopenia to platelet consumption in VWF-platelet microthrombi in TTP."
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy characterized by intravascular hemolysis, thrombocytopenia, and acute kidney failure."
        explanation: "Confirms thrombocytopenia as a defining feature of HUS alongside hemolysis and renal failure."

  - category: Clinical
    name: Acute Kidney Injury
    description: >
      Renal involvement with elevated creatinine, hematuria, and proteinuria is
      predominant in HUS. Severe cases may require acute dialysis.
    phenotype_term:
      preferred_term: Acute kidney injury
      term:
        id: HP:0001919
        label: Acute kidney injury
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy characterized by intravascular hemolysis, thrombocytopenia, and acute kidney failure."
        explanation: "Establishes acute kidney failure as a defining manifestation of HUS, the TMA subtype with predominant renal involvement."
      - reference: PMID:23738544
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Eculizumab inhibited complement-mediated thrombotic microangiopathy and was associated with significant time-dependent improvement in renal function in patients with atypical hemolytic-uremic syndrome."
        explanation: "Confirms renal dysfunction as the primary end-organ target in aHUS; reversal of renal impairment with complement inhibition demonstrates that complement-driven TMA underlies the kidney injury."

  - category: Clinical
    name: Neurological Manifestations
    description: >
      Neurological involvement including confusion, headache, focal neurological deficits,
      seizures, and coma occurs predominantly in TTP due to cerebral microvascular
      thrombosis.
    phenotype_term:
      preferred_term: Seizure
      term:
        id: HP:0001250
        label: Seizure

  - category: Laboratory
    name: Elevated Lactate Dehydrogenase
    description: >
      Markedly elevated serum LDH reflects both hemolysis and tissue ischemia, particularly
      in TTP. LDH levels often exceed 1000 U/L in active disease.
    phenotype_term:
      preferred_term: Increased circulating lactate dehydrogenase concentration
      term:
        id: HP:0025435
        label: Increased circulating lactate dehydrogenase concentration

  - category: Laboratory
    name: Schistocytes on Peripheral Blood Smear
    description: >
      Fragmented erythrocytes (schistocytes, helmet cells) on peripheral smear are the
      diagnostic hallmark of TMA, reflecting mechanical hemolysis in diseased microvessels.
    phenotype_term:
      preferred_term: Schistocytosis
      term:
        id: HP:0001981
        label: Schistocytosis

treatments:
  - name: Plasma Exchange Therapy
    description: >
      Therapeutic plasma exchange (TPE) is the cornerstone of TTP treatment. It removes
      autoantibodies against ADAMTS13 and ultra-large VWF multimers while replenishing
      ADAMTS13 activity. TPE reduces mortality from >90% to approximately 10-20% in TTP.
    treatment_term:
      preferred_term: therapeutic plasma exchange
      term:
        id: MAXO:0000950
        label: supportive care
    evidence:
      - reference: PMID:23738544
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: "Plasma exchange or infusion may transiently maintain normal levels of hematologic measures but does not treat the underlying systemic disease."
        explanation: "Demonstrates that plasma exchange is the established standard of care for TMA management, though this reference specifically notes its limitations in aHUS where it fails to address the underlying complement dysregulation."

  - name: Caplacizumab
    description: >
      Anti-VWF nanobody (caplacizumab) blocks VWF A1 domain binding to platelet GPIbα,
      rapidly inhibiting platelet-rich microthrombus formation in TTP. Approved as adjunct
      to TPE and immunosuppression for acquired TTP.
    treatment_term:
      preferred_term: caplacizumab anti-VWF nanobody therapy
      term:
        id: MAXO:0000058
        label: pharmacotherapy
      therapeutic_agent:
        - preferred_term: caplacizumab
          term:
            id: NCIT:C128625
            label: Caplacizumab
    evidence:
      - reference: PMID:30625070
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Among patients with TTP, treatment with caplacizumab was associated with faster normalization of the platelet count; a lower incidence of a composite of TTP-related death, recurrence of TTP, or a thromboembolic event during the treatment period; and a lower rate of recurrence of TTP during the trial than placebo."
        explanation: "Phase III RCT (HERCULES) demonstrating that caplacizumab significantly reduces TTP-related death, recurrence, and thromboembolic events compared to placebo, supporting its use as adjunct therapy."

  - name: Immunosuppression
    description: >
      Corticosteroids and rituximab (anti-CD20 monoclonal antibody) are used in immune-
      mediated TTP to suppress autoantibody production against ADAMTS13. Rituximab reduces
      relapse rates and is increasingly used upfront.
    treatment_term:
      preferred_term: immunosuppressive therapy
      term:
        id: MAXO:0000058
        label: pharmacotherapy
      therapeutic_agent:
        - preferred_term: corticosteroid
          term:
            id: CHEBI:50858
            label: corticosteroid
        - preferred_term: rituximab
          term:
            id: NCIT:C1702
            label: Rituximab
    evidence:
      - reference: PMID:12660343
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Recent studies have demonstrated that deficiency in the von Willebrand factor cleaving protease ADAMTS13, due to genetic mutations or autoimmune inhibitors, causes TTP."
        explanation: "Establishes the autoimmune basis of acquired TTP (autoantibody-mediated ADAMTS13 inhibition), providing the rationale for immunosuppressive therapy to suppress anti-ADAMTS13 autoantibody production."

  - name: Eculizumab and Ravulizumab
    description: >
      Terminal complement inhibitors (eculizumab, ravulizumab) block C5 cleavage and MAC
      formation, preventing complement-mediated endothelial injury in atypical HUS. These
      agents have transformed aHUS from a frequently fatal disease to one with high rates
      of renal recovery.
    treatment_term:
      preferred_term: complement C5 inhibitor therapy
      term:
        id: MAXO:0000058
        label: pharmacotherapy
      therapeutic_agent:
        - preferred_term: eculizumab
          term:
            id: NCIT:C48386
            label: Eculizumab
        - preferred_term: ravulizumab
          term:
            id: NCIT:C124657
            label: Ravulizumab
    evidence:
      - reference: PMID:23738544
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Eculizumab inhibited complement-mediated thrombotic microangiopathy and was associated with significant time-dependent improvement in renal function in patients with atypical hemolytic-uremic syndrome."
        explanation: "Phase II trials demonstrating that eculizumab inhibits complement-mediated TMA and significantly improves renal function in aHUS, validating complement inhibition as the primary therapeutic strategy."

genetic:
  - name: ADAMTS13
    gene_term:
      preferred_term: ADAMTS13
      term:
        id: hgnc:1366
        label: ADAMTS13
    association: Causative
    subtype: Thrombotic Thrombocytopenic Purpura
    inheritance:
      - name: Autosomal Recessive
    notes: >
      HGNC:1366 | OGG:3000011093. Biallelic loss-of-function mutations cause congenital
      TTP (Upshaw-Schulman syndrome). In acquired TTP, autoantibodies inhibit ADAMTS13
      activity. Both result in failure to cleave ultra-large VWF multimers, driving
      platelet-rich microthrombus formation.
    evidence:
      - reference: PMID:11586351
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We show that deficiency of ADAMTS13 is the molecular mechanism responsible for TTP, and suggest that physiologic proteolysis of VWF and/or other ADAMTS13 substrates is required for normal vascular homeostasis."
        explanation: "Landmark paper establishing ADAMTS13 loss-of-function as the causal mechanism in congenital TTP via genome-wide linkage in four pedigrees."
      - reference: PMID:12660343
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Recent studies have demonstrated that deficiency in the von Willebrand factor cleaving protease ADAMTS13, due to genetic mutations or autoimmune inhibitors, causes TTP."
        explanation: "Confirms both hereditary and autoimmune mechanisms of ADAMTS13 deficiency as causes of TTP."

  - name: CFH
    gene_term:
      preferred_term: CFH
      term:
        id: hgnc:4883
        label: CFH
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Dominant
      - name: Autosomal Recessive
    notes: >
      HGNC:4883 | OGG:3000003075. The most commonly mutated gene in atypical HUS (~20-30%
      of cases). Loss-of-function mutations in complement factor H impair regulation of the
      alternative pathway C3 convertase on endothelial cell surfaces, leading to uncontrolled
      C3b deposition. Anti-CFH autoantibodies (often associated with CFHR1/CFHR3 deletion)
      produce an acquired phenocopy.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "aHUS is associated primarily with mutations or autoantibodies leading to dysregulated complement activation."
        explanation: "Establishes complement gene mutations and autoantibodies — including anti-CFH — as the primary genetic drivers of aHUS."

  - name: CFI
    gene_term:
      preferred_term: CFI
      term:
        id: hgnc:5394
        label: CFI
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Dominant
    notes: >
      HGNC:5394 | OGG:3000003426. Loss-of-function mutations in complement factor I account
      for ~5-10% of aHUS cases. CFI is a serine protease that cleaves C3b and C4b in concert
      with CFH and MCP, reducing surface-bound complement activation.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "aHUS is associated primarily with mutations or autoantibodies leading to dysregulated complement activation."
        explanation: "Supports CFI mutations as part of the spectrum of complement regulatory gene defects causing aHUS."

  - name: CD46
    gene_term:
      preferred_term: CD46
      term:
        id: hgnc:6953
        label: CD46
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Dominant
    notes: >
      HGNC:6953 | OGG:3000004179. Also known as membrane cofactor protein (MCP).
      Loss-of-function mutations account for ~10-15% of aHUS. CD46 is expressed on
      endothelial cells and serves as a cofactor for CFI-mediated C3b inactivation;
      deficiency leaves endothelial surfaces vulnerable to complement attack.
      CD46-associated aHUS typically has good renal prognosis with spontaneous remission.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "aHUS is associated primarily with mutations or autoantibodies leading to dysregulated complement activation."
        explanation: "Supports CD46 loss-of-function as part of the complement regulatory gene defect spectrum in aHUS."

  - name: CFB
    gene_term:
      preferred_term: CFB
      term:
        id: hgnc:1037
        label: CFB
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Dominant
    notes: >
      HGNC:1037 | OGG:3000000629. Rare gain-of-function mutations in complement factor B
      stabilize the alternative pathway C3 convertase (C3bBb), amplifying complement
      activation on endothelial surfaces and causing aHUS.
    evidence:
      - reference: PMID:23738544
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Atypical hemolytic-uremic syndrome is a genetic, life-threatening, chronic disease of complement-mediated thrombotic microangiopathy."
        explanation: "Establishes aHUS as a genetically-driven complement-mediated TMA; CFB gain-of-function is part of this genetic landscape."

  - name: C3
    gene_term:
      preferred_term: C3
      term:
        id: hgnc:1318
        label: C3
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Dominant
    notes: >
      HGNC:1318 | OGG:3000000718. Rare gain-of-function mutations produce C3 variants
      resistant to inactivation by CFH, resulting in persistent C3 convertase activity
      and uncontrolled complement deposition on endothelial cell surfaces.
    evidence:
      - reference: PMID:23738544
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Atypical hemolytic-uremic syndrome is a genetic, life-threatening, chronic disease of complement-mediated thrombotic microangiopathy."
        explanation: "Establishes aHUS as a complement-mediated genetic disease; C3 gain-of-function mutations are a rare but recognized cause within this class."

  - name: THBD
    gene_term:
      preferred_term: THBD
      term:
        id: hgnc:11784
        label: THBD
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Dominant
    notes: >
      HGNC:11784 | OGG:3000007056. Rare loss-of-function mutations in thrombomodulin impair
      its role as a cofactor for CFI-mediated C3b inactivation and its direct
      anti-inflammatory properties, contributing to endothelial complement dysregulation
      and aHUS.

  - name: DGKE
    gene_term:
      preferred_term: DGKE
      term:
        id: hgnc:2852
        label: DGKE
    association: Causative
    subtype: Hemolytic Uremic Syndrome
    inheritance:
      - name: Autosomal Recessive
    notes: >
      HGNC:2852 | OGG:3000008526. Biallelic loss-of-function mutations in diacylglycerol
      kinase epsilon (DGKε) cause a complement-independent form of aHUS, typically
      presenting in children under 2 years. DGKε deficiency leads to persistent
      diacylglycerol signaling and prothrombotic endothelial activation; eculizumab is
      often less effective in this subgroup.
    evidence:
      - reference: PMID:28416508
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Among the 30% to 50% of patients with HUS who have no detectable complement defect, some have either impaired diacylglycerol kinase ε (DGKε) activity, cobalamin C deficiency, or plasminogen deficiency."
        explanation: "Identifies DGKE deficiency as a complement-independent genetic cause of HUS, distinct from the classical complement gene mutation spectrum."

  - name: VWF
    gene_term:
      preferred_term: VWF
      term:
        id: hgnc:12726
        label: VWF
    association: Modifier
    subtype: Thrombotic Thrombocytopenic Purpura
    notes: >
      HGNC:12726 | OGG:3000007450. VWF gene variants influencing multimer size or
      endothelial secretion rate modulate susceptibility and disease severity in TTP.
      VWF is the direct substrate for ADAMTS13; ultra-large multimers released from
      endothelial Weibel-Palade bodies are the pathogenic species that accumulate when
      ADAMTS13 is deficient.
    evidence:
      - reference: PMID:11586351
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Proteolysis of the blood-clotting protein von Willebrand factor (VWF) observed in normal plasma is decreased in TTP patients."
        explanation: "Establishes VWF as the direct substrate of ADAMTS13 and confirms impaired VWF proteolysis in TTP, implicating VWF multimer accumulation in disease pathogenesis."

clinical_trials:
  - name: NCT02553317
    phase: PHASE_III
    status: COMPLETED
    description: >
      HERCULES trial — Phase III double-blind, placebo-controlled RCT evaluating caplacizumab
      in acquired TTP. Established caplacizumab as the first approved targeted therapy for
      TTP, demonstrating faster platelet recovery and reduced TTP-related death, recurrence,
      and thromboembolic events.
    target_phenotypes:
      - preferred_term: Thrombocytopenia
        term:
          id: HP:0001873
          label: Thrombocytopenia
      - preferred_term: Microangiopathic hemolytic anemia
        term:
          id: HP:0001937
          label: Microangiopathic hemolytic anemia
    therapeutic_agent:
      - preferred_term: caplacizumab
        term:
          id: NCIT:C128625
          label: Caplacizumab
    evidence:
      - reference: clinicaltrials:NCT02553317
        supports: SUPPORT
        snippet: "The study was a Phase III, double-blind, placebo-controlled, randomized study to evaluate the efficacy of caplacizumab in more rapidly restoring normal platelet counts as measure of prevention of further microvascular thrombosis"
        explanation: "Registration trial establishing caplacizumab efficacy in acquired TTP; results published as PMID:30625070 (HERCULES)."

  - name: NCT03922308
    phase: PHASE_II
    status: COMPLETED
    description: >
      Phase 2 double-blind, placebo-controlled RCT evaluating recombinant ADAMTS13 (SHP655/rADAMTS13)
      added to standard of care in acquired TTP. Explores enzyme replacement as an alternative
      to plasma exchange for restoring ADAMTS13 activity.
    target_phenotypes:
      - preferred_term: Thrombocytopenia
        term:
          id: HP:0001873
          label: Thrombocytopenia
      - preferred_term: Microangiopathic hemolytic anemia
        term:
          id: HP:0001937
          label: Microangiopathic hemolytic anemia
    therapeutic_agent:
      - preferred_term: recombinant ADAMTS13 (apadamtase alfa)
        term:
          id: NCIT:C169784
          label: Apadamtase Alfa
    evidence:
      - reference: clinicaltrials:NCT03922308
        supports: SUPPORT
        snippet: "The purpose of this study is to evaluate the pharmacokinetics, safety, and efficacy of rADAMTS-13 (SHP655) administered in addition to standard of care (SoC) treatment of acquired thrombotic thrombocytopenic purpura (aTTP) participants."
        explanation: "First controlled evaluation of recombinant ADAMTS13 enzyme replacement in TTP, targeting the causal deficiency directly rather than through plasma exchange."

  - name: NCT06831058
    phase: PHASE_II
    status: RECRUITING
    description: >
      Pilot study of efgartigimod (neonatal Fc receptor inhibitor) in immune-mediated TTP.
      Efgartigimod depletes pathogenic IgG anti-ADAMTS13 autoantibodies by blocking FcRn-mediated
      IgG recycling, offering a novel immunomodulatory approach distinct from rituximab.
    target_phenotypes:
      - preferred_term: Thrombocytopenia
        term:
          id: HP:0001873
          label: Thrombocytopenia
      - preferred_term: Microangiopathic hemolytic anemia
        term:
          id: HP:0001937
          label: Microangiopathic hemolytic anemia
    therapeutic_agent:
      - preferred_term: efgartigimod (FcRn inhibitor)
        term:
          id: NCIT:C171817
          label: Efgartigimod Alfa
    evidence:
      - reference: clinicaltrials:NCT06831058
        supports: SUPPORT
        snippet: "It is expected that following efgartigimod therapy, there will be a rise in ADAMTS13 activity to the normal range that will be sustained during the treatment period."
        explanation: "Tests FcRn inhibition as a mechanism to deplete anti-ADAMTS13 IgG autoantibodies and restore ADAMTS13 activity in immune-mediated TTP."

  - name: NCT04889430
    phase: PHASE_III
    status: ACTIVE_NOT_RECRUITING
    description: >
      Phase 3 single-arm open-label trial of iptacopan (oral factor B inhibitor) in complement
      inhibitor-naive adult aHUS patients. Iptacopan blocks the alternative pathway proximal
      to C5, offering a twice-daily oral alternative to intravenous anti-C5 monoclonal antibodies.
    target_phenotypes:
      - preferred_term: Acute kidney injury
        term:
          id: HP:0001919
          label: Acute kidney injury
      - preferred_term: Thrombocytopenia
        term:
          id: HP:0001873
          label: Thrombocytopenia
    therapeutic_agent:
      - preferred_term: iptacopan (oral factor B inhibitor)
        term:
          id: CHEBI:229652
          label: iptacopan
    evidence:
      - reference: clinicaltrials:NCT04889430
        supports: SUPPORT
        snippet: "The purpose of this Phase 3 study is to determine whether iptacopan (LNP023) is efficacious and safe for the treatment of aHUS in adult patients who are treatment naive to complement inhibitor therapy."
        explanation: "First Phase 3 trial of an oral complement inhibitor in aHUS, targeting factor B to block alternative pathway activation upstream of C5."

  - name: NCT02205541
    phase: PHASE_III
    status: COMPLETED
    description: >
      ECULISHU — first prospective randomized placebo-controlled trial of eculizumab in
      pediatric STEC-HUS. This landmark study found that complement inhibition does not
      benefit typical STEC-HUS, clarifying the pathophysiological distinction from aHUS
      and establishing that STEC-HUS management remains supportive.
    target_phenotypes:
      - preferred_term: Acute kidney injury
        term:
          id: HP:0001919
          label: Acute kidney injury
      - preferred_term: Microangiopathic hemolytic anemia
        term:
          id: HP:0001937
          label: Microangiopathic hemolytic anemia
    therapeutic_agent:
      - preferred_term: eculizumab
        term:
          id: NCIT:C48386
          label: Eculizumab
    evidence:
      - reference: clinicaltrials:NCT02205541
        supports: SUPPORT
        snippet: "The investigators aim to perform the first controlled randomized prospective study using ECZ in pediatric STEC-HUS."
        explanation: "First RCT specifically designed to evaluate complement inhibition in STEC-HUS; its negative result reinforces that Shiga toxin-mediated injury is complement-independent and distinct from aHUS."

  - name: NCT06389474
    phase: PHASE_III
    status: RECRUITING
    description: >
      Phase 3 RCT of INM004 (polyclonal anti-Shiga toxin antibody preparation) in pediatric
      STEC-HUS. INM004 neutralizes circulating Shiga toxin 1 and 2 to prevent endothelial
      injury, addressing an unmet need as no disease-modifying therapy currently exists for
      STEC-HUS.
    target_phenotypes:
      - preferred_term: Acute kidney injury
        term:
          id: HP:0001919
          label: Acute kidney injury
      - preferred_term: Microangiopathic hemolytic anemia
        term:
          id: HP:0001937
          label: Microangiopathic hemolytic anemia
    therapeutic_agent:
      - preferred_term: INM004 (polyclonal anti-Shiga toxin antibody; investigational, no CHEBI/NCIT term)
    evidence:
      - reference: clinicaltrials:NCT06389474
        supports: SUPPORT
        snippet: "The objectives of this study are to evaluate the efficacy, safety, and pharmacokinetics of INM004 in pediatric patients with Hemolytic Uremic Syndrome associated to infection by Shiga toxin-producing Escherichia coli (STEC-HUS)."
        explanation: "Phase 3 trial targeting Shiga toxin neutralization as the primary pathogenic mechanism in STEC-HUS, addressing the current absence of approved disease-modifying therapy."
